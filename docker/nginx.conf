# ---------------------------------------------------------------------------
# KEMTA — configuration Nginx du conteneur frontend
#
# Rôle : servir l'application React (SPA), garder les assets immuables en cache
# et relayer l'API ainsi que les médias vers le backend. Les en-têtes de
# sécurité sont posés ici (TLS terminé en amont, chez l'hébergeur/CDN).
# ---------------------------------------------------------------------------
upstream kemta_backend {
    server backend:8000;
    keepalive 16;
}

# Limite d'envoi en accord avec MAX_UPLOAD_BYTES (photos de chantier, pièces).
client_max_body_size 16m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # --- Sécurité ------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml application/xml;

    # --- Sonde de santé du conteneur ----------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://kemta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Documentation OpenAPI générée par drf-spectacular.
    location ~ ^/(docs|schema)/ {
        proxy_pass http://kemta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ {
        proxy_pass http://kemta_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Médias (photos de chantier, pièces, logos) --------------------------
    location /media/ {
        proxy_pass http://kemta_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Statiques collectés par Django (admin, DRF) -------------------------
    location /static/ {
        proxy_pass http://kemta_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Assets compilés par Vite (nommés par empreinte) ---------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # --- Application React (SPA) --------------------------------------------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
