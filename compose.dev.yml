# ---------------------------------------------------------------------------
# KEMTA — surcharges de développement
#
#   docker compose -f compose.yml -f compose.dev.yml up
#
# Objectifs : sources montées dans les conteneurs (rechargement à chaud), OTP
# affiché dans les journaux, Celery synchrone, e-mails en console, API exposée
# sur 8000 et frontend Vite sur 5173.
#
# Variante sans Docker : PostgreSQL/SQLite + Redis local, ou les réglages dev
# (`DJANGO_SETTINGS_MODULE=config.settings.dev`) qui n'exigent aucune
# infrastructure. Voir « Démarrage local » dans le README.
# ---------------------------------------------------------------------------
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "1"
      OTP_DEV_ECHO: "true"
      SMS_PROVIDER: console
      LOG_JSON: "false"
      CELERY_TASK_ALWAYS_EAGER: "true"
      # Origines du serveur Vite (proxy /api) pendant le développement.
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_kemta &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      CELERY_TASK_ALWAYS_EAGER: "true"
      LOG_JSON: "false"
    command: ["celery", "-A", "config", "worker", "-l", "debug", "--concurrency", "1", "-B"]
    volumes:
      - ./backend:/app

  # En développement, Celery tourne dans le conteneur `worker` : beat séparé
  # ferait double emploi.
  beat:
    deploy:
      replicas: 0

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_TARGET: http://backend:8000
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
