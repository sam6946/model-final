<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KEMTA">
  <rect width="64" height="64" rx="14" fill="#063B5C" />
  <!-- Mât : la verticale du chantier -->
  <rect x="16" y="14" width="7" height="36" rx="2" fill="#FFFFFF" />
  <!-- Diagonale haute : la structure qui monte -->
  <path d="M27 32 L45 14 h-7.5 L27 25.5 Z" fill="#FFFFFF" />
  <!-- Diagonale basse : le niveau, la preuve au sol -->
  <path d="M27 32 L45 50 h-7.5 L27 38.5 Z" fill="#20A04B" />
  <!-- Trait de niveau : repère de contrôle -->
  <rect x="40" y="49.5" width="12" height="3.5" rx="1.75" fill="#20A04B" opacity="0.75" />
</svg>
